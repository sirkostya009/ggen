name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., bench, cmd/ggen, gen, integrationtests]
        goexperiment: ["", simd]
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # the simd tiers are exercised unconditionally, so they need real AVX-512
      - id: cpu
        run: |
          if grep -qw avx512bw /proc/cpuinfo; then echo "avx512=true" >> "$GITHUB_OUTPUT"; else echo "avx512=false" >> "$GITHUB_OUTPUT"; fi
      - if: matrix.goexperiment != 'simd' || steps.cpu.outputs.avx512 == 'true'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
